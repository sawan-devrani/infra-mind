name: Infra-Mind DevSecOps Pipeline

# on:
#   push:
#     branches: [main]
#   pull_request:
#     branches: [main]

on:
  push:
    branches:
      - '**'          # Matches every single branch
      - '!main'       # Excludes the main branch
      - '!master'     # Excludes the master branch

permissions:
  contents: write
  security-events: write
  actions: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/infra-mind
  IMAGE_TAG: ${{ github.sha }}
  PYTHON_VERSION: "3.11"

jobs:
  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --verbose --exit-code 1

  sca:
    name: SCA - Python Dependencies
    runs-on: ubuntu-latest
    needs: gitleaks
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f app/requirements.txt ]; then pip install -r app/requirements.txt; fi
          pip install safety

      - name: Run Safety scan
        run: safety check --full-report

