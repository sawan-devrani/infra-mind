name: Infra-Mind DevSecOps Pipeline

# on:
#   # push:
#   #   branches: [main]
#   pull_request:
#     branches: [main]

on:
  push:
    branches:
      - '**'          # Matches every single branch
      - '!main'       # Excludes the main branch
      - '!master'     # Excludes the master branch

# permissions:
#   contents: write
#   security-events: write
#   actions: read
#   packages: write

permissions: 
  contents: read 
  security-events: write 
  actions: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/infra-mind
  IMAGE_TAG: ${{ github.sha }}
  PYTHON_VERSION: "3.11"

jobs:
  gitleaks:
    name: Secret Scan - Gitleaks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          args: detect --source . --redact --verbose --exit-code 1
  sca:
    name: SCA and Config Scan - Trivy Filesystem
    runs-on: ubuntu-latest
    needs: gitleaks

    steps:
      - name: Checkout code
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8

      - name: Run Trivy filesystem scan
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: table
          exit-code: 1
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

      - name: Generate Trivy SARIF report
        if: always()
        uses: aquasecurity/trivy-action@v0.35.0
        with:
          scan-type: fs
          scan-ref: .
          format: sarif
          output: trivy-fs-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          scanners: vuln,secret,misconfig

      - name: Upload Trivy SARIF to GitHub Security
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-fs-results.sarif
