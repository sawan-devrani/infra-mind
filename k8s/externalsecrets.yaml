apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:                 
  namespace: infra-mind
  name: anthropic-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: SecretStore
  target:
    name: anthropic-secret
    creationPolicy: Owner
  data:                   
  - secretKey: ANTHROPIC_API_KEY
    remoteRef:
      key: secret/infra-mind
      property: ANTHROPIC_API_KEY
