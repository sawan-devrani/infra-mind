apiVersion: external-secrets.io/v1   # ← was v1beta1
kind: SecretStore
metadata:
  name: vault-backend
  namespace: default
  #namespace: infra-mind
spec:
  provider:
    vault:
      server: "http://vault.vault.svc.cluster.local:8200"
      path: "secret"
      version: "v2"
      auth:
        tokenSecretRef:
          name: vault-eso-token
          key: token
