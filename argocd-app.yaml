apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-mind
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/sawan-devrani/infra-mind.git
    targetRevision: HEAD
    path: k8s
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: false
      selfHeal: false
    syncOptions:
    - CreateNamespace=true
